flaskApp:
  image: python-flask-app
  tag: v6
  replicas: 2
  port: 5000
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"

redis:
  image: redis:7-alpine
  port: 6379

configMap:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

ingress:
  host: flask.local

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
